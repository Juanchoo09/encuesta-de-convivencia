# Puerto en el que corre el servidor
server.port=8080

# Base de datos H2 guardada como archivo local (persiste entre reinicios)
spring.datasource.url=jdbc:h2:file:./datos/encuesta;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web de H2 para revisar la base de datos manualmente si quieres
# (una vez el servidor este corriendo, entra a http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.docente.codigo-invitacion=CONVIVENCIA2026
